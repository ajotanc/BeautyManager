<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fd6b91" />
      <stop offset="45%" stop-color="#fd0054" />
      <stop offset="100%" stop-color="#800832" />
    </linearGradient>
    <linearGradient id="roseAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffebf0" />
      <stop offset="50%" stop-color="#ffb4c7" />
      <stop offset="100%" stop-color="#fd6b91" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFF0F3" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#05081f" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle Glow Elements -->
  <circle cx="120" cy="120" r="90" fill="#FFF0F3" opacity="0.18" />
  <circle cx="420" cy="400" r="110" fill="#FF8FA3" opacity="0.2" />

  <!-- Logo Graphics / BM Monogram with Sparkle & Beauty Flower -->
  <g filter="url(#shadow)">
    <!-- Elegant Sparkle Top Right -->
    <path d="M 380 100 Q 380 135 415 135 Q 380 135 380 170 Q 380 135 345 135 Q 380 135 380 100 Z" fill="#FFF0F3" />
    <path d="M 120 370 Q 120 390 140 390 Q 120 390 120 410 Q 120 390 100 390 Q 120 390 120 370 Z" fill="#FFF0F3" opacity="0.75" />
    
    <!-- Central Icon - Stylized Rose / Beauty Flower -->
    <g transform="translate(136, 115)">
      <!-- Beauty Flower Petals -->
      <path d="M 120 20 C 175 60 215 125 185 185 C 150 145 100 135 70 165 C 40 125 65 60 120 20 Z" fill="#FFFFFF" opacity="0.95" />
      <path d="M 120 20 C 65 60 25 125 55 185 C 90 145 140 135 170 165 C 200 125 175 60 120 20 Z" fill="#FFF0F3" opacity="0.85" />
      
      <!-- Rose Core -->
      <circle cx="120" cy="140" r="28" fill="url(#roseAccentGrad)" />
      <circle cx="120" cy="140" r="16" fill="#FFFFFF" />
    </g>

    <!-- BM Text Subtitle -->
    <text x="256" y="420" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">BEAUTY</text>
    <text x="256" y="455" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="20" fill="#FFF0F3" text-anchor="middle" letter-spacing="6">MANAGER</text>
  </g>
</svg>
